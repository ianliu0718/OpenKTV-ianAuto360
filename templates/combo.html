<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV 播放+遙控一體機</title>
    <style>
        /* --- 全局與響應式佈局 --- */
        body { background: #1a1a1a; color: white; font-family: "Microsoft JhengHei", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #player-container { flex: 0 0 45vh; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        #remote-container { flex: 1 1 auto; min-height: 0; min-width: 0; box-sizing: border-box; overflow-y: auto; overflow-x: hidden; padding: 15px; background: #222; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }

        /* 當螢幕夠寬 (例如筆電/PC) 時，自動變成左右分割模式 */
        @media (min-width: 800px) {
            body { flex-direction: row; }
            #player-container { flex: 2; height: 100vh; border-right: 2px solid #333; }
            #remote-container { flex: 1 1 0; height: 100vh; max-width: 450px; }
        }

        /* --- 播放器區塊 UI --- */
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        #overlay { position: absolute; top: 15px; left: 15px; font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 10; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 5px; pointer-events: none; }
        #next-info { position: absolute; top: 0; left: 0; right: 0; background: rgba(0, 100, 0, 0.8); color: white; text-align: center; padding: 8px; font-size: 16px; z-index: 20; display: none; font-weight: bold; }
        #fs-btn { position: absolute; top: 15px; right: 15px; z-index: 50; background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 5px 10px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        #fs-btn:hover { background: rgba(255,255,255,0.4); }
        #idle-screen { text-align: center; width: 100%; }
        #waiting { font-size: 24px; color: #aaa; cursor: pointer; border: 2px dashed #555; padding: 20px; border-radius: 10px; background: rgba(255,255,255,0.05); display: inline-block; }
        #waiting:hover { color: #fff; border-color: #fff; }
        #engine-status { position: absolute; bottom: 10px; left: 15px; z-index: 10; color: #66d9c5; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 3px #000; }
        #remote-qr { position: absolute; right: 15px; bottom: 15px; z-index: 30; padding: 10px; background: rgba(255,255,255,0.96); color: #111; border-radius: 8px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.5); }
        #remote-qr canvas, #remote-qr img { display: block; margin: 0 auto 6px; }
        #remote-qr-label { font-size: 12px; font-weight: bold; }
        #song-announcement { position: absolute; top: 50%; left: 50%; z-index: 25; width: min(82%, 720px); padding: 14px 22px; transform: translate(-50%, -50%); background: rgba(0,0,0,0.78); color: #fff; border-radius: 8px; text-align: center; font-size: clamp(20px, 3vw, 36px); font-weight: bold; line-height: 1.3; text-shadow: 2px 2px 4px #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        #song-announcement.visible { opacity: 1; }
        #queue-add-announcement { position: absolute; top: 15px; left: 50%; z-index: 24; max-width: 82%; padding: 8px 14px; transform: translateX(-50%); background: rgba(0,120,90,0.88); color: #fff; border-radius: 6px; text-align: center; font-size: 15px; font-weight: bold; text-shadow: 1px 1px 3px #000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #queue-add-announcement.visible { opacity: 1; }
        #ktv-subtitle { position: absolute; right: 0; bottom: 9%; left: 0; z-index: 22; display: flex; flex-direction: column; gap: 6px; pointer-events: none; font-size: clamp(calc(22px * var(--subtitle-scale, 2)), calc(3.6vw * var(--subtitle-scale, 2)), calc(44px * var(--subtitle-scale, 2))); font-weight: bold; line-height: 1.2; text-shadow: 2px 2px 4px #000, -1px -1px 2px #000; }
        #ktv-subtitle .subtitle-line { position: relative; display: block; max-width: 50%; color: #fff; }
        #ktv-subtitle .subtitle-line:first-child { align-self: flex-start; text-align: right; }
        #ktv-subtitle .subtitle-line:nth-child(2) { align-self: flex-end; text-align: left; }
        #ktv-subtitle .subtitle-line:only-child { align-self: center; max-width: 90%; text-align: center; }
        #ktv-subtitle .subtitle-text-layer { display: block; white-space: pre-wrap; }
        #ktv-subtitle .subtitle-char { display: inline-block; animation: ktv-char-pop 360ms cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--char-index) * 38ms); }
        @keyframes ktv-char-pop { 0% { opacity: 0; transform: scale(.72) translateY(10px); } 70% { transform: scale(1.12) translateY(-2px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* --- 遙控器區塊 UI --- */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s;}
        .btn:active { transform: scale(0.95); }
        .play { background: #009688; }
        .pause { background: #2196F3; }
        .stop { background: #F44336; }
        .vocal { background: #FF9800; color: black; }
        .inst { background: #FFC107; color: black; }
        .admin-link { background: #607D8B; color: white; text-align: center; display: block; padding: 12px; text-decoration: none; border-radius: 8px; margin-bottom: 15px; font-weight: bold;}
        
        /* 音量與歌單 */
        .control-group { background: #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .control-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #ccc;}
        input[type=range] { width: 100%; cursor: pointer;}
        .queue-box { background: #111; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; flex: 0 0 auto; max-height: 30vh; overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
        .queue-title { color: #4CAF50; font-size: 14px; margin-bottom: 5px; font-weight: bold;}
        #queue-list { font-size: 14px; color: #aaa; padding-left: 20px; margin: 0; min-height: 0; max-height: calc(30vh - 52px); overflow-y: auto; }
        #queue-list li { background: none; border: none; padding: 3px 0; display: list-item; list-style-type: decimal; }

        /* 搜尋與列表 */
        input[type=text] { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 8px; font-size: 15px;}
        ul#list { list-style: none; padding: 0; margin: 0; min-height: 0; flex: 1 1 auto; overflow-y: auto; }
        ul#list li { background: #2a2a2a; padding: 12px; margin-bottom: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444;}
        .song-btn { background: #009688; border: none; padding: 8px 16px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer;}
        .song-btn.added { background: #607d8b; cursor: wait; }
        li.song-added { border: 1px solid #4caf50; box-shadow: 0 0 0 1px rgba(76,175,80,0.25); }
        .category-filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .category-filters select { width: 100%; padding: 8px; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        const soundTouchModulePromise = import("https://esm.sh/@soundtouchjs/audio-worklet@2.1.1?bundle");
        const soundTouchProcessorUrl = "https://cdn.jsdelivr.net/npm/@soundtouchjs/audio-worklet@2.1.1/.dist/soundtouch-processor.js";
    </script>
</head>
<body>
    <div id="player-container">
        <div id="next-info">下一首：無</div>
        <div id="overlay">等待連線...</div>
        <div id="song-announcement"></div>
        <div id="queue-add-announcement"></div>
        <div id="ktv-subtitle" aria-live="polite"></div>
        <div id="engine-status">音訊引擎：尚未啟動</div>
        <div id="remote-qr"><div id="remote-qr-code"></div><div id="remote-qr-label">掃描加入遙控器</div></div>
        <div id="fs-btn" onclick="toggleFullScreen()">⛶ 全螢幕</div>
        
        <div id="idle-screen" ondblclick="toggleFullScreen()">
            <div id="waiting" onclick="initSystem()">📺 點擊此處啟動音效引擎</div>
        </div>
        
        <video id="vid" playsinline crossorigin="anonymous" ondblclick="toggleFullScreen()">
            <track id="subtitle-track" kind="subtitles" srclang="zh" label="字幕">
        </video>
    </div>

    <div id="remote-container">
        <a href="/admin" class="admin-link">⚙️ 進入後台 (下載新歌)</a>

        <div id="current-song-control" style="display:none; background:#123c36; padding:12px; border:1px solid #2aa894; border-radius:8px; margin-bottom:15px;">
            <div id="current-song-name" style="overflow-wrap:anywhere; margin-bottom:8px; color:#b8fff2;"></div>
            <button id="current-subtitle-button" class="btn" style="margin:0; background:#2aa894;" onclick="toggleCurrentSubtitle()">字幕：隱藏</button>
            <div style="display:flex; justify-content:space-between; margin-top:8px; color:#b8fff2; font-size:13px;">
                <span>字幕字體大小</span><span id="subtitle-size-label">標準（100%）</span>
            </div>
            <div style="display:flex; gap:6px; margin-top:5px;">
                <button id="subtitle-size-small" class="btn" style="margin:0; padding:8px; background:#536d7a;" onclick="setSubtitleFontSize(80)">小字</button>
                <button id="subtitle-size-normal" class="btn" style="margin:0; padding:8px; background:#536d7a;" onclick="setSubtitleFontSize(100)">標準</button>
                <button id="subtitle-size-large" class="btn" style="margin:0; padding:8px; background:#536d7a;" onclick="setSubtitleFontSize(120)">大字</button>
            </div>
        </div>
        
        <div class="grid">
            <button class="btn vocal" onclick="track('original')">🎤 原聲</button>
            <button class="btn vocal" onclick="track('guide')">🎵 導唱</button>
            <button class="btn inst" onclick="track('instrumental')">🚫 伴奏</button>
            <button class="btn pause" onclick="cmd('pause')">⏯ 暫停/播放</button>
            <button class="btn stop" onclick="cmd('cut')">⏹ 切歌 (下一首)</button>
        </div>

<div class="control-group">
            <div class="control-label"><span>🔊 音量控制</span><span id="vol-val">100%</span></div>
            <input type="range" id="vol" min="0" max="2" step="0.1" value="1" oninput="updateEffect()">
        </div>

        <div class="control-group">
            <div class="control-label"><span>🎵 升降 KEY</span><span id="key-val">原 KEY (0)</span></div>
            <div style="display: flex; gap: 5px;">
                <button class="btn" style="background:#555; flex:1;" onclick="changeKey(-1)">🔻 降</button>
                <button class="btn" style="background:#777; flex:1;" onclick="changeKey(0)">0 (原)</button>
                <button class="btn" style="background:#555; flex:1;" onclick="changeKey(1)">🔺 升</button>
            </div>
        </div>

        <div class="queue-box">
            <div class="queue-title">📋 待播清單</div>
            <ul id="queue-list"><li>(無)</li></ul>
        </div>

        <input type="text" id="search" placeholder="🔍 搜尋歌曲..." oninput="filter()">
        <div class="category-filters">
            <select id="song-length-filter" aria-label="依歌曲名稱字數分類" onchange="filter()"><option value="">歌曲字數：全部</option></select>
            <select id="singer-filter" aria-label="依主唱者分類" onchange="filter()"><option value="">主唱者：全部</option></select>
            <select id="language-filter" aria-label="依語言分類" onchange="filter()"><option value="">語言：全部</option></select>
        </div>
        <ul id="list"></ul>
    </div>

    <script>
const socket = io();
        
        // --- 播放器邏輯 ---
        const video = document.getElementById('vid');
        const overlay = document.getElementById('overlay');
        const nextInfo = document.getElementById('next-info');
        const idleScreen = document.getElementById('idle-screen');
        const waitingBtn = document.getElementById('waiting');
        const playerContainer = document.getElementById('player-container');
        const engineStatus = document.getElementById('engine-status');
        const subtitleTrack = document.getElementById('subtitle-track');
        const ktvSubtitle = document.getElementById('ktv-subtitle');
        const songAnnouncement = document.getElementById('song-announcement');
        const queueAddAnnouncement = document.getElementById('queue-add-announcement');
        const remoteQr = document.getElementById('remote-qr');
        const remoteQrCode = document.getElementById('remote-qr-code');
        
        let audioCtx, source, splitter, audioGains, merger, masterGain, soundTouchNode, pitchShift;
        let isAudioSetup = false;
        let audioSetupPromise;
        let useSoundTouch = false;
        let currentMode = 'original';
        let currentKey = 0; 
        let currentFilename = '';
        let isSixChannelAudio = false;
        let announcementTimer;
        let queueAddAnnouncementTimer;

        /**
         * Shows the filename that was successfully added to the all-in-one queue.
         * @param {string} filename Newly queued song filename.
         */
        function showQueueAddAnnouncement(filename) {
            clearTimeout(queueAddAnnouncementTimer);
            queueAddAnnouncement.textContent = `已加入待播：${filename.replace(/\.mp4$/i, '')}`;
            queueAddAnnouncement.classList.add('visible');
            queueAddAnnouncementTimer = setTimeout(() => queueAddAnnouncement.classList.remove('visible'), 5000);
        }

        /**
         * Shows the playing filename in the center of the all-in-one screen for ten seconds.
         * @param {string} filename Current song filename.
         */
        function showSongAnnouncement(filename) {
            clearTimeout(announcementTimer);
            songAnnouncement.textContent = filename.replace(/\.mp4$/i, '');
            songAnnouncement.classList.add('visible');
            announcementTimer = setTimeout(() => songAnnouncement.classList.remove('visible'), 10000);
        }

        /**
         * Creates the QR Code that opens the current server's remote control page.
         */
        function createRemoteQrCode() {
            if (typeof QRCode === 'undefined') return;
            new QRCode(remoteQrCode, {
                text: `${window.location.origin}/remote`,
                width: 120,
                height: 120,
                colorDark: '#111111',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M,
            });
        }

        /**
         * Applies the server's QR Code visibility state to the all-in-one screen.
         * @param {Object} data QR Code visibility state with a visible field.
         */
        function updateRemoteQrVisibility(data) {
            remoteQr.style.display = data.visible ? 'block' : 'none';
        }

        createRemoteQrCode();
        socket.on('qr_visibility', updateRemoteQrVisibility);

        /**
         * Shows the audio processor currently used by the all-in-one player.
         * @param {string} message Engine name and optional diagnostic detail.
         */
        function setEngineStatus(message) {
            engineStatus.innerText = `音訊引擎：${message}`;
        }

        /**
         * Loads the current song's matching WebVTT file and controls its visibility.
         * @param {string} filename Current MP4 filename.
         * @param {boolean} visible Whether subtitles should be visible.
         */
        function setSubtitle(filename, visible) {
            currentFilename = filename;
            subtitleTrack.src = `/subtitles/${encodeURIComponent(filename.replace(/\.mp4$/i, '.vtt'))}`;
            subtitleTrack.track.mode = 'hidden';
            ktvSubtitle.style.display = visible ? 'flex' : 'none';
            ktvSubtitle.replaceChildren();
        }

        /**
         * Applies the shared subtitle font size sent by the remote control.
         * @param {number} fontSize Subtitle size percentage.
         */
        function applySubtitleFontSize(fontSize) {
            const size = Number(fontSize);
            if (![80, 100, 120].includes(size)) return;
            ktvSubtitle.style.setProperty('--subtitle-scale', String(size / 100));
        }

        /**
         * Wraps subtitle text in animated characters for the KTV entrance effect.
         * @param {string} text Subtitle line text.
         * @returns {HTMLSpanElement} Rendered subtitle text layer.
         */
        function createSubtitleTextLayer(text) {
            const layer = document.createElement('span');
            layer.className = 'subtitle-text-layer';
            Array.from(text).forEach((character, index) => {
                const characterElement = document.createElement('span');
                characterElement.className = 'subtitle-char';
                characterElement.style.setProperty('--char-index', String(index));
                characterElement.textContent = character;
                layer.appendChild(characterElement);
            });
            return layer;
        }

        /**
         * Renders the active WebVTT cue as at most two KTV subtitle lines.
         */
        function renderKtvSubtitle() {
            const activeCues = subtitleTrack.track.activeCues;
            ktvSubtitle.replaceChildren();
            if (!activeCues || !activeCues.length) return;
            const lines = String(activeCues[0].text || '')
                .replace(/<[^>]*>/g, '')
                .split(/\r?\n/)
                .filter(Boolean)
                .slice(0, 2);
            lines.forEach((line) => {
                const lineElement = document.createElement('span');
                lineElement.className = 'subtitle-line';
                lineElement.appendChild(createSubtitleTextLayer(line));
                ktvSubtitle.appendChild(lineElement);
            });
        }

        subtitleTrack.track.addEventListener('cuechange', renderKtvSubtitle);

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (playerContainer.requestFullscreen) playerContainer.requestFullscreen();
                else if (playerContainer.webkitRequestFullscreen) playerContainer.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function initSystem() {
            if(!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            waitingBtn.innerHTML = "✅ 音效已啟動<br><span style='font-size:16px;color:#888;'>請從下方/右方點歌</span>";
            waitingBtn.style.borderColor = "#4CAF50";
            waitingBtn.style.color = "#4CAF50";
            setupAudio().catch((error) => {
                overlay.innerText = `⚠️ 音效引擎啟動失敗：${error.message}`;
            });
        }

        /**
         * Builds the all-in-one KTV Web Audio graph with SoundTouch pitch processing.
         * @returns {Promise<void>} Resolves after the AudioWorklet is connected.
         */
        async function setupAudio() {
            if(isAudioSetup) return;
            if(audioSetupPromise) return audioSetupPromise;
            if(!audioCtx) initSystem();
            audioSetupPromise = (async () => {
                source = audioCtx.createMediaElementSource(video);
                source.channelInterpretation = 'discrete';
                splitter = audioCtx.createChannelSplitter(6);
                splitter.channelInterpretation = 'discrete';
                merger = audioCtx.createChannelMerger(2);
                audioGains = Array.from({ length: 6 }, () => audioCtx.createGain());
                masterGain = audioCtx.createGain();
                useSoundTouch = Boolean(audioCtx.audioWorklet);
                if (useSoundTouch) {
                    const { SoundTouchNode } = await soundTouchModulePromise;
                    await SoundTouchNode.register(audioCtx, soundTouchProcessorUrl);
                    soundTouchNode = new SoundTouchNode({ context: audioCtx });
                    soundTouchNode.playbackRate.value = 1;
                    setEngineStatus('SoundTouch AudioWorklet');
                } else {
                    Tone.setContext(audioCtx);
                    pitchShift = new Tone.PitchShift({ pitch: currentKey, windowSize: 0.05, delayTime: 0.01, feedback: 0 }).toDestination();
                    pitchShift.wet.value = currentKey === 0 ? 0 : 1;
                    setEngineStatus('Tone.js fallback（HTTP LAN）');
                }
                setAudioKey(currentKey);

                source.connect(splitter);
                audioGains.forEach((gain, channel) => {
                    splitter.connect(gain, channel);
                    gain.connect(merger, 0, 0);
                    gain.connect(merger, 0, 1);
                });
                merger.connect(masterGain);
                if (useSoundTouch) masterGain.connect(soundTouchNode).connect(audioCtx.destination);
                else Tone.connect(masterGain, pitchShift);
                isAudioSetup = true;
                setAudioMode(currentMode);
            })();
            return audioSetupPromise;
        }

        /**
         * Applies the KTV key as a SoundTouch pitch ratio at the current audio time.
         * @param {number} semitones Signed semitone offset from the original key.
         */
        function setAudioKey(semitones) {
            const value = Number(semitones);
            if (!Number.isFinite(value) || !audioCtx) return;
            const bounded = Math.max(-12, Math.min(12, value));
            if (useSoundTouch && soundTouchNode) {
                const ratio = 2 ** (bounded / 12);
                const now = audioCtx.currentTime;
                soundTouchNode.pitch.setValueAtTime(ratio, now);
                soundTouchNode.pitchSemitones.setValueAtTime(0, now);
            } else if (pitchShift) {
                pitchShift.pitch = bounded;
                pitchShift.wet.rampTo(bounded === 0 ? 0 : 1, 0.03);
            }
        }

        /**
         * Applies a bounded KEY value to the local SoundTouch node and display.
         * @param {number} semitones Signed semitone offset from the original key.
         */
        function applyKey(semitones) {
            const value = Number(semitones);
            if (!Number.isFinite(value)) return;
            currentKey = Math.max(-12, Math.min(12, value));
            setAudioKey(currentKey);
            document.getElementById('key-val').innerText = currentKey === 0 ? "原 KEY (0)" : (currentKey > 0 ? "+" + currentKey : currentKey);
        }

        /**
         * Changes KEY locally before broadcasting it to other connected players.
         * @param {number} step Number of semitones to move, or zero to reset.
         */
        function changeKey(step) {
            if (step === 0) currentKey = 0;
            else currentKey += step;
            applyKey(currentKey);
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            socket.emit('control_effect', { pitch: currentKey });
        }

        socket.on('apply_effect', (data) => {
            if(masterGain && data.volume !== undefined) {
                masterGain.gain.setTargetAtTime(data.volume, audioCtx.currentTime, 0.1);
                document.getElementById('vol').value = data.volume;
                document.getElementById('vol-val').innerText = Math.round(data.volume * 100) + "%";
            }
            if(data.pitch !== undefined) {
                const pitch = Number(data.pitch);
                if (!Number.isFinite(pitch)) return;
                applyKey(pitch);
            }
        });

        // 👑 修正點 1：刪除重複的 play_video 事件，合併為一個乾淨的版本
        socket.on('play_video', (data) => {
            idleScreen.style.display = 'none';
            video.style.display = 'block';
            overlay.innerText = "播放中: " + data.title;
            showSongAnnouncement(data.filename);
            currentKey = 0;
            setSubtitle(data.filename, false);
            setAudioKey(0);
            video.src = "/songs/" + encodeURIComponent(data.filename) + "?t=" + new Date().getTime();
            setupAudio().then(() => video.play()).then(() => {
                isSixChannelAudio = Number(data.audio_channels) >= 6;
                setAudioMode('original'); 
                updateEffect(); 
                socket.emit('control_effect', { pitch: 0 }); // 新歌自動回歸原 KEY
            }).catch(e => { overlay.innerText = "⚠️ 請點擊畫面開始播放"; });
        });

        socket.on('queue_song_added', (data) => showQueueAddAnnouncement(data.filename));

        socket.on('subtitle_state', (data) => {
            if (data.filename === currentFilename) {
                setSubtitle(data.filename, data.visible);
                applySubtitleFontSize(data.font_size);
            }
        });

        // 👑 修正點 2：當影片播完時，發送 song_ended 讓後端決定下一首歌
        video.onended = function() { socket.emit('song_ended'); };

        socket.on('connect', () => { overlay.innerText = "✅ 已連線"; });

        socket.on('stop_video', () => {
            video.pause(); video.src = ""; video.style.display = 'none';
            idleScreen.style.display = 'block'; overlay.innerText = "⏹ 已停止 (待機中)";
            nextInfo.style.display = 'none';
            songAnnouncement.classList.remove('visible');
            clearTimeout(announcementTimer);
        });

        socket.on('command', (cmd) => {
            if (cmd === 'pause') video.paused ? video.play() : video.pause();
        });

        socket.on('set_audio', (mode) => {
            currentMode = mode;
            setAudioMode(mode);
        });

        /**
         * Selects one stereo pair from a six-channel KTV stream or the legacy L/R stream.
         * @param {string} mode Playback mode: original, guide, or instrumental.
         */
        function setAudioMode(mode) {
            if(!isAudioSetup || !audioGains) return;
            const now = audioCtx.currentTime;
            audioGains.forEach((gain) => gain.gain.setTargetAtTime(0, now, 0.1));
            const channels = isSixChannelAudio
                ? (mode === 'guide' ? [2, 3] : mode === 'instrumental' ? [4, 5] : [0, 1])
                : (mode === 'instrumental' ? [1] : mode === 'guide' ? [0, 1] : [0]);
            channels.forEach((channel) => audioGains[channel].gain.setTargetAtTime(1, now, 0.1));
            overlay.innerText = mode === 'guide' ? "🎵 模式：導唱" : mode === 'instrumental' ? "🚫 模式：伴奏" : "🎤 模式：原聲";
        }

        // --- 遙控器邏輯 ---
        let allSongs = [];
        let subtitleSongs = new Set();
        let currentPlayingFilename = '';
        let currentSubtitleVisible = false;
        const pendingSongs = new Set();

        /**
         * Loads the songs that have a matching subtitle file.
         */
        function loadSubtitleList() {
            fetch('/api/subtitles').then(response => response.json()).then(songs => {
                subtitleSongs = new Set(songs);
                filter();
                renderCurrentSongControl();
            });
        }

        /**
         * Parses the fixed song filename format into classification fields.
         * @param {string} filename Song filename in song-singer-language-id.mp4 format.
         * @returns {Object} Song metadata with title, singer, language, and length fields.
         */
        function parseSongMetadata(filename) {
            const name = filename.replace(/\.mp4$/i, '');
            const parts = name.split('-');
            if (parts.length < 2) return { title: name, singer: '未辨識', language: '未辨識', length: '未辨識' };
            const title = parts[0];
            return { title, singer: parts[1] || '未辨識', language: parts[2] || '未辨識', length: String(Array.from(title).length) };
        }

        /**
         * Rebuilds category selectors from the currently loaded song list.
         */
        function renderCategoryFilters() {
            const lengthFilter = document.getElementById('song-length-filter');
            const singerFilter = document.getElementById('singer-filter');
            const languageFilter = document.getElementById('language-filter');
            const previous = [lengthFilter.value, singerFilter.value, languageFilter.value];
            const metadata = allSongs.map(parseSongMetadata);
            const lengths = [...new Set(metadata.map(song => song.length))].sort((a, b) => Number(a) - Number(b));
            const singers = [...new Set(metadata.map(song => song.singer))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const languages = [...new Set(metadata.map(song => song.language))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            lengthFilter.innerHTML = '<option value="">歌曲字數：全部</option>' + lengths.map(value => `<option value="${value}">${value === '未辨識' ? value : `${value} 字`}</option>`).join('');
            singerFilter.innerHTML = '<option value="">主唱者：全部</option>' + singers.map(value => `<option value="${value}">${value}</option>`).join('');
            languageFilter.innerHTML = '<option value="">語言：全部</option>' + languages.map(value => `<option value="${value}">${value}</option>`).join('');
            [lengthFilter, singerFilter, languageFilter].forEach((filterElement, index) => { filterElement.value = previous[index]; });
        }

        /**
         * Renders the subtitle control for the song currently being played.
         */
        function renderCurrentSongControl() {
            const control = document.getElementById('current-song-control');
            const name = document.getElementById('current-song-name');
            const button = document.getElementById('current-subtitle-button');
            const hasSong = Boolean(currentPlayingFilename);
            const hasSubtitle = subtitleSongs.has(currentPlayingFilename);
            control.style.display = hasSong && hasSubtitle ? 'block' : 'none';
            if (!hasSong) return;
            name.textContent = `播放中：${currentPlayingFilename.replace(/\.mp4$/i, '')}`;
            button.textContent = currentSubtitleVisible ? '字幕：顯示中' : '字幕：隱藏';
        }

        /**
         * Updates the fixed playback subtitle control from the server state.
         * @param {Object} data Current playback state with filename and visible fields.
         */
        function updateCurrentSong(data) {
            currentPlayingFilename = data.filename || '';
            currentSubtitleVisible = Boolean(data.visible);
            applySubtitleFontSize(data.font_size);
            renderCurrentSongControl();
        }

        /**
         * Toggles subtitles for the song currently being played.
         */
        function toggleCurrentSubtitle() {
            if (currentPlayingFilename) toggleSubtitle(currentPlayingFilename);
        }

        /**
         * Sets the shared subtitle font size for all playback screens.
         * @param {number} fontSize Subtitle size percentage.
         */
        function setSubtitleFontSize(fontSize) {
            if (![80, 100, 120].includes(fontSize)) return;
            applySubtitleFontSize(fontSize);
            renderSubtitleFontSizeControl(fontSize);
            socket.emit('set_subtitle_font_size', { font_size: fontSize });
        }

        /**
         * Updates the all-in-one subtitle size label and selected button.
         * @param {number} fontSize Current subtitle size percentage.
         */
        function renderSubtitleFontSizeControl(fontSize) {
            const labels = { 80: '小字（80%）', 100: '標準（100%）', 120: '大字（120%）' };
            const buttonIds = { 80: 'subtitle-size-small', 100: 'subtitle-size-normal', 120: 'subtitle-size-large' };
            document.getElementById('subtitle-size-label').textContent = labels[fontSize] || labels[100];
            Object.entries(buttonIds).forEach(([size, buttonId]) => {
                const button = document.getElementById(buttonId);
                const selected = Number(size) === fontSize;
                button.setAttribute('aria-pressed', String(selected));
                button.style.background = selected ? '#2aa894' : '#536d7a';
            });
        }

        socket.on('current_song', updateCurrentSong);

        socket.on('subtitle_state', (data) => {
            if (data.filename === currentPlayingFilename) {
                currentSubtitleVisible = Boolean(data.visible);
                if (data.font_size !== undefined) {
                    renderSubtitleFontSizeControl(Number(data.font_size));
                }
                renderCurrentSongControl();
            }
        });

        function updateEffect() {
            const vol = parseFloat(document.getElementById('vol').value);
            document.getElementById('vol-val').innerText = Math.round(vol * 100) + "%";
            socket.emit('control_effect', { volume: vol });
        }

        socket.on('update_list', (songs) => { allSongs = songs; renderCategoryFilters(); filter(); });

        socket.on('update_queue', (playlist) => {
            if(playlist.length > 1) {
                nextInfo.innerText = "下一首：" + playlist[1].replace('.mp4', '');
                nextInfo.style.display = 'block';
            } else {
                nextInfo.style.display = 'none';
            }

            const qList = document.getElementById('queue-list');
            qList.innerHTML = "";
            if(playlist.length === 0) {
                qList.innerHTML = "<li>(無)</li>";
            } else {
                playlist.forEach((s, index) => {
                    const name = index === 0 ? `🎵 播放中：${s.replace('.mp4', '')}` : s.replace('.mp4', '');
                    qList.innerHTML += `<li${index === 0 ? ' style="color:#4CAF50; font-weight:bold;"' : ''}><span>${name}</span>${index === 0 ? '' : `<button class="song-btn" onclick="removeQueuedSong(${index})">刪除</button>`}</li>`;
                });
            }
        });

        /**
         * Requests removal of one waiting song from the server queue.
         * @param {number} queueIndex Zero-based queue index; index zero is protected.
         */
        function removeQueuedSong(queueIndex) {
            socket.emit('remove_from_queue', { index: queueIndex });
        }

        function filter() {
            const key = document.getElementById('search').value.toLowerCase();
            const selectedLength = document.getElementById('song-length-filter').value;
            const selectedSinger = document.getElementById('singer-filter').value;
            const selectedLanguage = document.getElementById('language-filter').value;
            const list = document.getElementById('list');
            list.innerHTML = "";
            allSongs.filter(s => {
                const metadata = parseSongMetadata(s);
                return s.toLowerCase().includes(key)
                    && (!selectedLength || metadata.length === selectedLength)
                    && (!selectedSinger || metadata.singer === selectedSinger)
                    && (!selectedLanguage || metadata.language === selectedLanguage);
            }).forEach(s => {
                const name = s.replace('.mp4', '');
                const subtitleButton = subtitleSongs.has(s) ? `<button class="song-btn" onclick="toggleSubtitle('${s}')">字幕</button>` : '';
                const isPending = pendingSongs.has(s);
                const playButton = isPending
                    ? '<button class="song-btn added" disabled>已加入</button>'
                    : `<button class="song-btn" onclick="play(this, '${s}')">播歌</button>`;
                list.innerHTML += `<li class="${isPending ? 'song-added' : ''}"><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%; font-size:15px;">${name}</span><span>${subtitleButton}${playButton}</span></li>`;
            });
        }

        /**
         * Requests the player to toggle subtitles for a song with an attached file.
         * @param {string} filename Song filename used by the player.
         */
        function toggleSubtitle(filename) { socket.emit('toggle_subtitle', { filename: filename }); }

        /**
         * Sends a song to the queue and keeps visible feedback during the request window.
         * @param {HTMLButtonElement} button Clicked play button.
         * @param {string} filename Song filename to queue.
         */
        function play(button, filename) {
            if (pendingSongs.has(filename)) return;
            pendingSongs.add(filename);
            button.disabled = true;
            button.classList.add('added');
            button.textContent = '已加入';
            button.closest('li').classList.add('song-added');
            socket.emit('add_to_queue', {filename: filename}); 
            setTimeout(() => {
                pendingSongs.delete(filename);
                filter();
            }, 1500);
        }

        function cmd(action) { socket.emit('control', action); }
        function track(mode) { socket.emit('change_track', mode); }

        function loadList() {
            fetch('/api/list').then(r => r.json()).then(data => { allSongs = data; renderCategoryFilters(); filter(); });
        }
        
        loadList();
        loadSubtitleList();
        socket.on('refresh_list', () => { loadList(); loadSubtitleList(); });
    </script>
</body>
</html>
