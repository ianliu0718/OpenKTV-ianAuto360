<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV 遙控器</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 10px; margin: 0; }
        .btn { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .play { background: #009688; }
        .pause { background: #2196F3; }
        .stop { background: #F44336; }
        .vocal { background: #FF9800; color: black; }
        .inst { background: #FFC107; color: black; }
        .admin-link { background: #607D8B; color: white; text-align: center; display: block; padding: 10px; text-decoration: none; border-radius: 5px; margin-bottom: 10px; }
        input[type=text] { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 5px;}
        input[type=range] { width: 100%; margin: 10px 0; }
        li { background: #333; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        ul { list-style: none; padding: 0; }
        .queue-box { background: #111; padding: 12px; border: 1px solid #444; border-radius: 8px; margin: 10px 0; max-height: 30vh; overflow: hidden; }
        .queue-title { color: #4CAF50; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        #queue-list { max-height: calc(30vh - 52px); margin: 0; padding-left: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #queue-list li { background: none; padding: 4px 0; margin: 0; display: list-item; list-style-type: decimal; color: #aaa; overflow-wrap: anywhere; }
        .song-btn { background: #009688; border: none; padding: 5px 15px; border-radius: 20px; color: white; }
        .song-btn.added { background: #607d8b; cursor: wait; }
        .song-status { margin-right: 6px; color: #80cbc4; font-size: 13px; font-weight: bold; white-space: nowrap; }
        .song-audio-exception { color: #ffcc80; font-size: 12px; font-weight: bold; white-space: normal; overflow-wrap: anywhere; }
        .song-main { display: flex; flex-direction: column; min-width: 0; max-width: 60%; }
        .song-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        li.song-playing { background: #174d48; border: 1px solid #26a69a; }
        li.song-row { cursor: pointer; }
        li.song-row:hover { background: #34514e; }
        li.song-added { border: 1px solid #4caf50; box-shadow: 0 0 0 1px rgba(76,175,80,0.25); }
        .category-filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .category-filters select { width: 100%; padding: 8px; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
        .search-row { display: flex; gap: 6px; align-items: stretch; }
        .search-row input[type=text] { flex: 1; margin-bottom: 10px; }
        .clear-filter-button { width: auto; margin: 0 0 10px; padding: 10px 14px; background: #607D8B; white-space: nowrap; }
        .tab-bar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: -10px -10px 10px; padding: 10px; background: #1a1a1a; }
        .tab-button { width: 100%; padding: 12px 8px; border: 1px solid #555; border-radius: 6px; background: #333; color: #bbb; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-button.active { background: #009688; border-color: #34cdbd; color: white; }
        .song-tools { position: sticky; top: 60px; z-index: 9; padding-top: 4px; background: #1a1a1a; }
        .setting-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .setting-button { display: flex; align-items: center; gap: 8px; min-height: 46px; box-sizing: border-box; padding: 12px; border-radius: 8px; background: #333; color: #ccc; font-size: 14px; font-weight: bold; cursor: pointer; }
        .setting-button input { width: auto; flex: 0 0 auto; }
        .tab-panel[hidden] { display: none; }
        /* 待播歌曲備註面板，採用固定面板避免推動遙控器內容。 */
        #song-note-panel { display: none; position: fixed; inset: 10% 5% auto; z-index: 20; background: #222; border: 1px solid #555; border-radius: 8px; padding: 15px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
        #song-note-panel h4 { margin: 0 0 12px; overflow-wrap: anywhere; }
        #song-note-panel label { display: block; margin: 10px 0; color: #ddd; }
        #song-note-panel textarea { width: 100%; box-sizing: border-box; padding: 9px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
        #song-note-panel textarea { min-height: 80px; resize: vertical; }
        .note-key-controls { display: flex; gap: 8px; }
        .note-key-controls .btn { margin: 0; flex: 1; padding: 10px; }
        .note-actions { display: flex; gap: 8px; margin-top: 12px; }
        .note-actions .btn { margin: 0; flex: 1; padding: 10px; }
        .note-indicator { color: #ffd54f; margin-left: 6px; }
        .danmaku-button { background: #e91e63; }
        .sound-effect-button { background: #00897b; }
        #danmaku-panel { display: none; position: fixed; top: max(12px, env(safe-area-inset-top)); right: 5%; bottom: max(12px, env(safe-area-inset-bottom)); left: 5%; box-sizing: border-box; overflow: hidden; z-index: 30; background: #222; border: 1px solid #777; border-radius: 8px; padding: 15px; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,.65); }
        #danmaku-panel h4 { margin: 0 0 12px; }
        .emotion-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-bottom: 10px; border-bottom: 1px solid #555; }
        .emotion-tab { margin: 0; padding: 9px 10px; border: 1px solid transparent; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; background: transparent; color: #999; font-size: 14px; font-weight: normal; box-shadow: none; }
        .emotion-tab.active { background: #333; border-color: #555; border-bottom-color: #2aa894; color: #b8fff2; font-weight: bold; }
        .emotion-tab-panel { flex: 1; min-height: 0; overflow-y: auto; }
        .emotion-tab-panel[hidden] { display: none; }
        .photo-picker { display: flex; flex-direction: column; gap: 10px; align-items: stretch; padding: 10px 0; color: #ccc; }
        .photo-picker input[type=file] { width: 100%; padding: 10px; box-sizing: border-box; background: #333; color: #ddd; border: 1px solid #555; border-radius: 6px; }
        .photo-picker-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .photo-picker-actions .btn { margin: 0; }
        .photo-upload-button { background: #00695c; color: #fff; border: 1px solid #4db6ac; }
        .photo-upload-button:hover { background: #00897b; }
        .photo-camera-button { background: #1565c0; color: #fff; border: 1px solid #64b5f6; }
        .photo-camera-button:hover { background: #1976d2; }
        .photo-picker-actions .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        .photo-preview { display: none; max-width: 100%; max-height: 30vh; margin: 0 auto; border-radius: 8px; object-fit: contain; }
        .danmaku-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .danmaku-presets .btn { margin: 0; padding: 10px 6px; background: #5c3b6f; }
        .effect-section { margin-top: 0; padding-top: 0; border-top: 0; }
        .effect-section-title { margin-bottom: 8px; color: #b8fff2; font-size: 14px; font-weight: bold; }
        .sound-effect-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .sound-effect-list .btn { margin: 0; padding: 10px 6px; }
        .subtitle-controls-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
        .subtitle-controls-row .btn { min-height: 42px; margin: 0; padding: 8px 5px; font-size: 13px; }
        #danmaku-custom-text { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
        .danmaku-actions { display: flex; gap: 8px; margin-top: 10px; }
        .danmaku-actions .btn { flex: 1; margin: 0; }
        .emotion-footer { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #555; }
        .emotion-footer .btn { flex: 1; margin: 0; min-height: 46px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div style="text-align:center; margin-bottom:10px;">
        <h3 style="margin:0;">📱 KTV 遙控器</h3>
        <small style="color:#aaa;">已連線至主機</small>
    </div>

    <a href="/admin" class="admin-link">⚙️ 進入後台 (下載新歌/管理系統)</a>

    <div class="tab-bar" role="tablist" aria-label="遙控器功能分頁">
        <button id="song-tab" class="tab-button active" role="tab" aria-selected="true" aria-controls="song-panel" onclick="switchTab('song')">🎶 點歌</button>
        <button id="control-tab" class="tab-button" role="tab" aria-selected="false" aria-controls="control-panel" onclick="switchTab('control')">🎛️ 實際遙控</button>
    </div>

    <section id="song-panel" class="tab-panel" role="tabpanel" aria-labelledby="song-tab">
        <div class="song-tools">
            <div class="search-row">
                <input type="text" id="search" placeholder="🔍 搜尋歌曲..." oninput="handleSearchInput()">
                <button type="button" class="btn clear-filter-button" onclick="clearFilters()">清除篩選</button>
            </div>
            <div class="category-filters">
                <select id="song-length-filter" aria-label="依歌曲名稱字數分類" onchange="handleCategoryChange('song-length-filter')"><option value="">歌曲字數：全部</option></select>
                <select id="singer-filter" aria-label="依主唱者分類" onchange="handleCategoryChange('singer-filter')"><option value="">主唱者：全部</option></select>
                <select id="language-filter" aria-label="依語言分類" onchange="handleCategoryChange('language-filter')"><option value="">語言：全部</option></select>
            </div>
        </div>
        <ul id="list"></ul>
    </section>

    <section id="control-panel" class="tab-panel" role="tabpanel" aria-labelledby="control-tab" hidden>
        <div id="current-song-control" style="display:none; background:#123c36; padding:12px; border:1px solid #2aa894; border-radius:8px; margin-bottom:10px;">
            <div id="current-song-name" style="overflow-wrap:anywhere; margin-bottom:8px; color:#b8fff2;"></div>
            <div class="subtitle-controls-row">
                <button id="current-subtitle-button" class="btn" style="background:#2aa894;" onclick="toggleCurrentSubtitle()">字幕：隱藏</button>
                <button id="subtitle-style-button" class="btn subtitle-style-button" style="background:#455a64;" onclick="cycleSubtitleStyleMode()">字幕：背景</button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; color:#b8fff2; font-size:13px;">
                <span>字幕比例</span><span id="subtitle-size-label" style="min-width:56px; text-align:right; color:#f9f9c5; font-weight:700;">120%</span>
            </div>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button id="subtitle-size-decrease" class="btn" style="margin:0; flex:1; padding:10px 12px; background:linear-gradient(180deg, #607d8b 0%, #4f6775 100%); border-radius:10px; min-width:52px; font-size:18px; font-weight:700; box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 10px rgba(0,0,0,0.18);" onclick="changeSubtitleFontSize(-10)">−</button>
                <button id="subtitle-size-increase" class="btn" style="margin:0; flex:1; padding:10px 12px; background:linear-gradient(180deg, #607d8b 0%, #4f6775 100%); border-radius:10px; min-width:52px; font-size:18px; font-weight:700; box-shadow:inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 10px rgba(0,0,0,0.18);" onclick="changeSubtitleFontSize(10)">＋</button>
            </div>
        </div>

        <div class="setting-grid" style="margin-bottom:10px;">
            <label class="setting-button">
                <input type="checkbox" id="qr-visibility" checked style="width:auto;">
                顯示播放端 QR Code
            </label>
            <label class="setting-button">
                <input type="checkbox" id="random-play" style="width:auto;">
                無點歌時隨機播歌
            </label>
            <label class="setting-button">
                <input type="checkbox" id="screen-wake-lock" checked style="width:auto;">
                螢幕保持常亮
            </label>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <button class="btn pause" onclick="cmd('pause')">⏯ 暫停/繼續</button>
            <button class="btn stop" onclick="cmd('cut')">⏹ 切歌</button>
            <button class="btn play" onclick="replayCurrentSong()">🔁 重唱</button>
            <button class="btn vocal" onclick="track('original')">🎤 原聲</button>
            <button class="btn vocal" onclick="track('guide')">🎵 導唱</button>
            <button class="btn inst" onclick="track('instrumental')">🚫 伴奏</button>
            <button class="btn danmaku-button" onclick="openDanmakuPanel()">💬 情緒價值</button>
        </div>

        <div id="guide-vocal-control" class="control-group" style="display:none;">
            <div class="control-label"><label for="guide-vocal-level">🎵 導唱人聲音量</label><span id="guide-vocal-level-label">50%</span></div>
            <input type="range" id="guide-vocal-level" min="0" max="100" step="1" value="50" aria-label="導唱人聲音量" oninput="updateGuideVocalLevel(this.value)">
        </div>

        <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin: 10px 0;">
            <div style="display:flex; justify-content:space-between; align-items:center; color:#ccc; font-size:14px;">
                <span>🔊 主音量</span><span id="vol-val">100%</span>
            </div>
            <input type="range" id="vol" min="0" max="2" step="0.01" value="1" aria-label="主音量" oninput="updateEffect()">
        </div>

        <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #ccc; font-size: 14px;">
                <span>🎵 升降 KEY</span><span id="key-val">原 KEY (0)</span>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="background:#555; flex:1; padding: 12px; margin: 0;" onclick="changeKey(-1)">🔻 降</button>
                <button class="btn" style="background:#777; flex:1; padding: 12px; margin: 0;" onclick="changeKey(0)">0 (原)</button>
                <button class="btn" style="background:#555; flex:1; padding: 12px; margin: 0;" onclick="changeKey(1)">🔺 升</button>
            </div>
        </div>

        <div id="seek-correction-control" style="display: none; background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #ccc; font-size: 14px;">
                <span>⏱ 畫面延遲（聲音提前）</span><span id="seek-val">0 秒</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;">
                <button class="btn seek-control" style="background:#555; padding: 12px 4px; margin: 0;" onclick="seekVideo(-0.5)">&lt;&lt;0.5</button>
                <button class="btn seek-control" style="background:#555; padding: 12px 4px; margin: 0;" onclick="seekVideo(-0.1)">&lt;0.1</button>
                <button class="btn seek-control" style="background:#777; padding: 12px 4px; margin: 0;" onclick="seekVideo(0)">同步</button>
                <button class="btn seek-control" style="background:#555; padding: 12px 4px; margin: 0;" onclick="seekVideo(0.1)">0.1&gt;</button>
                <button class="btn seek-control" style="background:#555; padding: 12px 4px; margin: 0;" onclick="seekVideo(0.5)">0.5&gt;&gt;</button>
            </div>
        </div>

        <div class="queue-box">
            <div class="queue-title">📋 待播清單</div>
            <ul id="queue-list"><li>(無)</li></ul>
        </div>
    </section>

    <div id="danmaku-panel" role="dialog" aria-modal="true" aria-labelledby="danmaku-title">
        <h4 id="danmaku-title">情緒價值</h4>
        <div class="emotion-tabs" role="tablist" aria-label="情緒價值分類">
            <button id="emotion-tab-danmaku" class="btn emotion-tab active" type="button" role="tab" aria-selected="true" onclick="switchEmotionTab('danmaku')">💬 彈幕</button>
            <button id="emotion-tab-sound" class="btn emotion-tab" type="button" role="tab" aria-selected="false" onclick="switchEmotionTab('sound')">🔊 音效</button>
            <button id="emotion-tab-photo" class="btn emotion-tab" type="button" role="tab" aria-selected="false" onclick="switchEmotionTab('photo')">📷 照片</button>
        </div>
        <div id="emotion-panel-danmaku" class="emotion-tab-panel" role="tabpanel" aria-labelledby="emotion-tab-danmaku">
            <div class="effect-section">
            <div class="danmaku-presets">
                <button class="btn" type="button" onclick="sendDanmaku('🎤 大家一起唱！')">🎤 大家一起唱！</button>
                <button class="btn" type="button" onclick="sendDanmaku('👏 掌聲鼓勵！')">👏 掌聲鼓勵！</button>
                <button class="btn" type="button" onclick="sendDanmaku('🎶 再一首！')">🎶 再一首！</button>
                <button class="btn" type="button" onclick="sendDanmaku('🔥 麥霸出場！')">🔥 麥霸出場！</button>
                <button class="btn" type="button" onclick="sendDanmaku('💖 這對好有默契！')">💖 好有默契！</button>
                <button class="btn" type="button" onclick="sendDanmaku('✨ 氣氛到最高點！')">✨ 氣氛到最高點！</button>
                <button class="btn" type="button" onclick="sendDanmaku('🕺💃 全場一起搖！')">🕺💃 全場一起搖！</button>
                <button class="btn" type="button" onclick="sendRandomCompliment()">🎲 隨機誇獎</button>
            </div>
            <input id="danmaku-custom-text" type="text" maxlength="100" placeholder="輸入自訂彈幕">
            </div>
        </div>
        <div id="emotion-panel-sound" class="emotion-tab-panel" role="tabpanel" aria-labelledby="emotion-tab-sound" hidden>
            <div class="effect-section">
            <div class="sound-effect-list">
                <button class="btn sound-effect-button" type="button" onclick="sendSoundEffect('clap')">👏 歡呼拍手</button>
            </div>
            </div>
        </div>
        <div id="emotion-panel-photo" class="emotion-tab-panel" role="tabpanel" aria-labelledby="emotion-tab-photo" hidden>
            <div class="photo-picker">
                <div class="photo-picker-actions">
                    <button class="btn photo-upload-button" type="button" onclick="chooseEmotionPhotoUpload()">🖼️ 上傳照片</button>
                    <button class="btn photo-camera-button" type="button" onclick="openEmotionCamera()">📷 開啟相機</button>
                </div>
                <input id="emotion-photo-upload-input" type="file" accept="image/*" hidden onchange="prepareEmotionPhoto(event)">
                <input id="emotion-photo-camera-input" type="file" accept="image/*" capture="environment" hidden onchange="prepareEmotionPhoto(event)">
                <img id="emotion-photo-preview" class="photo-preview" alt="照片預覽">
            </div>
        </div>
        <div class="emotion-footer">
            <button class="btn" style="background:#607D8B;" type="button" onclick="closeDanmakuPanel()">取消</button>
            <button class="btn" style="background:#e91e63;" type="button" onclick="sendEmotionAction()">送出</button>
        </div>
    </div>

    <div id="song-note-panel" role="dialog" aria-modal="true" aria-labelledby="song-note-title">
        <h4 id="song-note-title">歌曲備註</h4>
        <label id="note-lyrics-label"><input type="checkbox" id="note-lyrics"> 想加入歌詞</label>
        <label>適合的 KEY</label>
        <div class="note-key-controls">
            <button class="btn" style="background:#555;" type="button" onclick="adjustNoteKey(-1)">−</button>
            <button class="btn" id="note-key-value" style="background:#777;" type="button" onclick="resetNoteKey()">原 KEY</button>
            <button class="btn" style="background:#555;" type="button" onclick="adjustNoteKey(1)">＋</button>
        </div>
        <label>自填文字
            <textarea id="note-custom-text" maxlength="500" placeholder="例如：請幫我補歌詞"></textarea>
        </label>
        <div class="note-actions">
            <button class="btn" style="background:#607D8B;" type="button" onclick="closeSongNote()">取消</button>
            <button class="btn" style="background:#009688;" type="button" onclick="saveSongNote()">儲存</button>
        </div>
    </div>

    <script>
        const socket = io();
        let allSongs = [];
        let sortedSongMetadata = [];
        let songAudioExceptions = {};
        let subtitleSongs = new Set();
        let currentKey = 0;
        let currentPlayingFilename = '';
        let currentTrackMode = 'original';
        let guideVocalControlSupported = false;
        let currentVocalLevel = 50;
        let currentSubtitleMode = 0;
        const subtitleDisplayLabels = ['隱藏', '單行', '雙行', '雙行漸變'];
        let currentSubtitleFontSize = 120;
        let currentSubtitleStyleMode = 0;
        const subtitleStyleLabels = ['背景', '陰影'];
        let songScrollTop = 0;
        let seekOffset = 0;
        let seekCorrectionEnabled = false;
        let currentPlaylist = [];
        let songNotes = {};
        let editingSongFilename = '';
        let editingNoteKeyValue = 0;
        const pendingSongs = new Set();
        const qrVisibility = document.getElementById('qr-visibility');
        const randomPlay = document.getElementById('random-play');
        const screenWakeLock = document.getElementById('screen-wake-lock');
        let screenWakeLockSentinel = null;
        let screenWakeLockEnabled = localStorage.getItem('ktv-screen-wake-lock') !== 'false';

        /** Requests the browser to keep this phone or tablet screen awake. */
        async function requestScreenWakeLock() {
            if (!('wakeLock' in navigator)) {
                screenWakeLock.disabled = true;
                screenWakeLock.checked = false;
                screenWakeLockEnabled = false;
                return false;
            }
            try {
                screenWakeLockSentinel = await navigator.wakeLock.request('screen');
                screenWakeLockSentinel.addEventListener('release', () => {
                    screenWakeLockSentinel = null;
                    if (screenWakeLockEnabled && document.visibilityState === 'visible') {
                        requestScreenWakeLock();
                    }
                }, { once: true });
                return true;
            } catch (error) {
                screenWakeLockSentinel = null;
                return false;
            }
        }

        function releaseScreenWakeLock() {
            if (screenWakeLockSentinel) {
                screenWakeLockSentinel.release();
                screenWakeLockSentinel = null;
            }
        }

        async function setScreenWakeLock(enabled) {
            screenWakeLockEnabled = Boolean(enabled);
            localStorage.setItem('ktv-screen-wake-lock', String(screenWakeLockEnabled));
            if (screenWakeLockEnabled) {
                const acquired = await requestScreenWakeLock();
                screenWakeLock.checked = acquired;
                if (!acquired) screenWakeLockEnabled = false;
            } else {
                releaseScreenWakeLock();
                screenWakeLock.checked = false;
            }
        }

        screenWakeLock.checked = screenWakeLockEnabled;
        screenWakeLock.addEventListener('change', () => setScreenWakeLock(screenWakeLock.checked));
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && screenWakeLockEnabled && !screenWakeLockSentinel) {
                requestScreenWakeLock().then((acquired) => { screenWakeLock.checked = acquired; });

        function prepareEmotionPhoto(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const image = new Image();
            image.onload = () => {
                const scale = Math.min(1, 1280 / Math.max(image.width, image.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
                pendingEmotionPhoto = canvas.toDataURL('image/jpeg', 0.82);
                const preview = document.getElementById('emotion-photo-preview');
                preview.src = pendingEmotionPhoto;
                preview.style.display = 'block';
            };
            image.src = URL.createObjectURL(file);

        /**
         * Parses the fixed song filename format into classification fields.
         * @param {string} filename Song filename in song-singer-language-id.mp4 format.
         * @returns {Object} Song metadata with title, singer, language, and length fields.
         */
        function parseSongMetadata(filename) {
            const name = filename.replace(/\.mp4$/i, '');
            const parts = name.split('-');
            if (parts.length < 2) return { title: name, singer: '未辨識', language: '未辨識', length: '未辨識' };
            const title = parts[0];
            return { title, singer: parts[1] || '未辨識', language: parts[2] || '未辨識', length: String(Array.from(title).length) };
        }

        /**
         * Extracts the final numeric song code used for reverse sorting.
         * @param {string} filename Song filename.
         * @returns {number|null} Numeric song code, or null when unavailable.
         */
        function getSongCode(filename) {
            const match = filename.match(/(\d+)(?:\.mp4)?$/i);
            return match ? Number(match[1]) : null;
        }

        /**
         * Sorts songs with unknown codes first, then numeric codes descending.
         * @param {string} firstFilename First song filename.
         * @param {string} secondFilename Second song filename.
         * @returns {number} Sort comparison result.
         */
        function compareSongCodeDescending(firstFilename, secondFilename) {
            const firstCode = getSongCode(firstFilename);
            const secondCode = getSongCode(secondFilename);
            if (firstCode === null && secondCode === null) return firstFilename.localeCompare(secondFilename, 'zh-Hant');
            if (firstCode === null) return -1;
            if (secondCode === null) return 1;
            return secondCode - firstCode || firstFilename.localeCompare(secondFilename, 'zh-Hant');
        }

        function setSongList(songs) {
            allSongs = Array.isArray(songs) ? songs : [];
            sortedSongMetadata = allSongs.map((filename) => ({ filename, metadata: parseSongMetadata(filename) }))
                .sort((firstSong, secondSong) => compareSongCodeDescending(firstSong.filename, secondSong.filename));
        }

        /**
         * Rebuilds category selectors from the currently loaded song list.
         */
        function renderCategoryFilters() {
            const lengthFilter = document.getElementById('song-length-filter');
            const singerFilter = document.getElementById('singer-filter');
            const languageFilter = document.getElementById('language-filter');
            const previous = [lengthFilter.value, singerFilter.value, languageFilter.value];
            const metadata = allSongs.map(parseSongMetadata);
            const lengths = [...new Set(metadata.map(song => song.length))].sort((a, b) => Number(a) - Number(b));
            const singers = [...new Set(metadata.map(song => song.singer))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            const languages = [...new Set(metadata.map(song => song.language))].sort((a, b) => a.localeCompare(b, 'zh-Hant'));
            lengthFilter.innerHTML = '<option value="">歌曲字數：全部</option>' + lengths.map(value => `<option value="${value}">${value === '未辨識' ? value : `${value} 字`}</option>`).join('');
            singerFilter.innerHTML = '<option value="">主唱者：全部</option>' + singers.map(value => `<option value="${value}">${value}</option>`).join('');
            languageFilter.innerHTML = '<option value="">語言：全部</option>' + languages.map(value => `<option value="${value}">${value}</option>`).join('');
            [lengthFilter, singerFilter, languageFilter].forEach((filterElement, index) => { filterElement.value = previous[index]; });
        }

        function renderSubtitleStyleButton() {

            button.textContent = `${label}`;

        /** Cycle through the four exclusive modes and let the server synchronize playback clients. */
        function cycleSubtitleStyleMode() {
            socket.emit('set_subtitle_style_mode', { mode: (currentSubtitleStyleMode + 1) % subtitleStyleLabels.length });

        /** Show the vocal slider only for a marked vocal-stem song in guide mode. */
        function renderGuideVocalControl() {

            renderGuideVocalControl();
            socket.emit('change_vocal_level', { level: currentVocalLevel });

        /**
         * Updates the fixed playback subtitle control from the server state.
         * @param {Object} data Current playback state with filename and visible fields.
         */
        function updateCurrentSong(data) {
            currentPlayingFilename = data.filename || '';
            guideVocalControlSupported = Boolean(data.guide_vocal_control);
            if (!currentPlayingFilename) {
                currentPlaylist = [];
                renderQueue([]);
            }
            const hasSubtitle = subtitleSongs.has(currentPlayingFilename);
            currentSubtitleMode = hasSubtitle ? Math.max(0, Math.min(3, Number(data.subtitle_mode) || 0)) : 0;
            currentSubtitleFontSize = Number(data.font_size) || 120;
            updateSeekOffset(Number(data.seek_offset) || 0);

            renderSubtitleFontSizeControl();

        function toggleCurrentSubtitle() {
            if (currentPlayingFilename && subtitleSongs.has(currentPlayingFilename)) {
                const nextMode = (currentSubtitleMode + 1) % subtitleDisplayLabels.length;
                socket.emit('set_subtitle_mode', { filename: currentPlayingFilename, mode: nextMode });
            }
        }

        /**
         * Adjusts the shared subtitle font size by a controlled step and clamps it to a safe range.
         * @param {number} step Amount to change the subtitle scale in percentage points.
         */
        function changeSubtitleFontSize(step) {
            const nextSize = Math.min(200, Math.max(80, currentSubtitleFontSize + step));
            if (nextSize === currentSubtitleFontSize) return;
            currentSubtitleFontSize = nextSize;
            renderSubtitleFontSizeControl();
            socket.emit('set_subtitle_font_size', { font_size: nextSize });
        }

        /**

        function renderSubtitleFontSizeControl() {

            document.getElementById('subtitle-size-label').textContent = label;
            const increaseButton = document.getElementById('subtitle-size-increase');
            const decreaseButton = document.getElementById('subtitle-size-decrease');
            increaseButton.disabled = currentSubtitleFontSize >= 200;
            decreaseButton.disabled = currentSubtitleFontSize <= 80;
            increaseButton.style.opacity = increaseButton.disabled ? '0.55' : '1';
            decreaseButton.style.opacity = decreaseButton.disabled ? '0.55' : '1';

        function songAudioExceptionLabel(filename) {
            const exception = songAudioExceptions[filename];
            const measuredPeak = Number(exception?.c4_true_peak_dbtp);
            if (!exception || !Number.isFinite(measuredPeak)) return '';
            const peakText = `${measuredPeak >= 0 ? '+' : ''}${measuredPeak.toFixed(1)} dBTP`;
            return `<span class="song-audio-exception">⚠ c4 TP ${peakText}</span>`;
        }

        function filter() {
            const key = document.getElementById('search').value.toLowerCase();
            const selectedLength = document.getElementById('song-length-filter').value;
            const selectedSinger = document.getElementById('singer-filter').value;
            const selectedLanguage = document.getElementById('language-filter').value;
            const list = document.getElementById('list');
            const rows = sortedSongMetadata.filter(({ filename, metadata }) => {
                return filename.toLowerCase().includes(key)
                    && (!selectedLength || metadata.length === selectedLength)
                    && (!selectedSinger || metadata.singer === selectedSinger)
                    && (!selectedLanguage || metadata.language === selectedLanguage);
            }).map(({ filename: s }) => {
                const subtitleButton = subtitleSongs.has(s) ? '<button class="song-btn" type="button" disabled title="此歌有字幕">字幕</button>' : '';
                const isPending = pendingSongs.has(s);
                const queueIndex = currentPlaylist.indexOf(s);
                const isQueued = queueIndex !== -1;
                const isPlaying = queueIndex === 0;
                const statusLabel = isPlaying ? '<span class="song-status">播放中</span>' : isQueued ? '<span class="song-status">已排隊</span>' : '';
                const exceptionLabel = songAudioExceptionLabel(s);
                const playButton = isPending
                    ? '<button class="song-btn added" disabled>已加入</button>'
                    : `<button class="song-btn" onclick="play(this, '${s}')">播歌</button>`;
                return `
                    <li class="song-row ${isPending || isQueued ? 'song-added' : ''} ${isPlaying ? 'song-playing' : ''}" onclick="playSongFromRow(this, '${s}', event)">
                        <span class="song-main"><span class="song-name">${statusLabel}${s}</span>${exceptionLabel}</span>
                        <span>${subtitleButton}${playButton}</span>
                    </li>`;
            });
            list.innerHTML = rows.join('');
        }

        /**
         * Sends a song to the queue and keeps visible feedback during the request window.
         * @param {HTMLButtonElement} button Clicked play button.
         * @param {string} filename Song filename to queue.
         */
        function play(button, filename) {
            if (pendingSongs.has(filename)) return;
            pendingSongs.add(filename);
            button.disabled = true;
            button.classList.add('added');
            button.textContent = '已加入';
            button.closest('li').classList.add('song-added');
            socket.emit('add_to_queue', {filename: filename});
            setTimeout(() => {
                pendingSongs.delete(filename);
                filter();
            }, 1500);
        }

        /**
         * Queues a song when its song row is selected.
         * @param {HTMLLIElement} rowElement Selected song row.
         * @param {string} filename Song filename to queue.
         * @param {MouseEvent} event Click event used to preserve nested button actions.
         */
        function playSongFromRow(rowElement, filename, event) {
            if (event.target.closest('button')) return;
            const playButton = rowElement.querySelector('button[onclick^="play("]');
            if (playButton) play(playButton, filename);
        }

        function cmd(action) { socket.emit('control', action); }
        function track(mode) { socket.emit('change_track', mode); }

        /**
         * Inserts the currently playing song as the next queued song.
         */
        function replayCurrentSong() { socket.emit('replay_current_song'); }

        function loadList() {
            fetch('/api/list').then(r => r.json()).then((songs) => {
                setSongList(songs);
                renderCategoryFilters();
                filter();
                fetch('/api/song-audio-exceptions').then(r => r.json()).then((exceptions) => {
                    songAudioExceptions = exceptions && typeof exceptions === 'object' ? exceptions : {};
                    filter();
                }).catch(() => { songAudioExceptions = {}; });
            });
        }
        
        loadList();
        loadSubtitleList();
        // 監聽後台更新完畢事件，自動重整歌單
        socket.on('refresh_list', () => { loadList(); loadSubtitleList(); });

        // --- 音效與升降 KEY 控制 ---
        function updateEffect() {
            const vol = parseFloat(document.getElementById('vol').value);
            document.getElementById('vol-val').innerText = Math.round(vol * 100) + "%";
            socket.emit('control_effect', { volume: vol });
        }

        function changeKey(step) {
            if (step === 0) {
                currentKey = 0;
            } else {
                currentKey += step;
            }
            
            // 限制最多升降 12 個半音 (一個八度)
            if(currentKey > 12) currentKey = 12;
            if(currentKey < -12) currentKey = -12;
            
            socket.emit('control_effect', { pitch: currentKey });
        }

        /**
         * Requests a half-second playback position adjustment for all players.
         * @param {-0.5|-0.1|0|0.1|0.5} seconds Signed seek adjustment in seconds.
         */
        function seekVideo(seconds) {
            if (![-0.5, -0.1, 0, 0.1, 0.5].includes(seconds)) return;
            // 伺服器端已經驗證秒數合法，且本次使用情境下功能開關由伺服器主控。
            // 若在這裡再擋一次 local seekCorrectionEnabled，會讓按鈕點擊完全沒有反應，
            // 導致遠端 UI 看起來可點但實際不發送任何 seek_video 事件。
            socket.emit('seek_video', { seconds });
        }

        /**
         * Updates the server-controlled video progress correction state.
         * @param {boolean} enabled Whether video-only progress correction is enabled.
         */
        function updateSeekCorrectionState(enabled) {
            seekCorrectionEnabled = Boolean(enabled);
            // 伺服器未開啟畫面延遲功能時，遙控器不顯示無法使用的控制區。
            document.getElementById('seek-correction-control').style.display = seekCorrectionEnabled ? 'block' : 'none';
            document.querySelectorAll('.seek-control').forEach((button) => {
                button.disabled = !seekCorrectionEnabled;
                button.style.opacity = seekCorrectionEnabled ? '1' : '0.45';
            });
            document.getElementById('seek-val').innerText = seekCorrectionEnabled
                ? (seekOffset === 0 ? '0 秒' : `${seekOffset.toFixed(1)} 秒`)
                : '伺服器已關閉';
        }

        /**
         * Displays the accumulated video-only offset from the original position.
         * @param {number} offset Signed accumulated offset in seconds.
         */
        function updateSeekOffset(offset) {
            seekOffset = Math.round(offset * 10) / 10;
            document.getElementById('seek-val').innerText = seekOffset === 0
                ? '同步'
                : seekOffset > 0
                    ? `延遲 ${seekOffset.toFixed(1)} 秒`
                    : `提前 ${Math.abs(seekOffset).toFixed(1)} 秒`;
        }

        socket.on('seek_video', (data) => updateSeekOffset(Number(data.offset) || 0));
        socket.on('seek_correction', (data) => updateSeekCorrectionState(Boolean(data && data.enabled)));

        // 接收伺服器廣播，同步更新介面狀態 (若有其他手機也在操作)
        socket.on('apply_effect', (data) => {
            if (data.pitch !== undefined) {
                currentKey = data.pitch;
                document.getElementById('key-val').innerText = currentKey === 0 ? "原 KEY (0)" : (currentKey > 0 ? "+" + currentKey : currentKey);
            }
            if (data.volume !== undefined) {
                document.getElementById('vol').value = data.volume;
                document.getElementById('vol-val').innerText = Math.round(data.volume * 100) + "%";
            }
        });
    </script>
</body>
</html>
